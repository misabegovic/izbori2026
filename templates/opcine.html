{% extends "base.html" %}
{% block title %}Općine — Izbori 2026{% endblock %}
{% block content %}
<h1>Općine</h1>
<input type="search" id="q" placeholder="Kucaj naziv općine…" oninput="filterOpcine()">
<div id="opcine-list">
{% for group, items in groups %}
<h2>{{ group }}</h2>
{% for m in items %}
<div class="opcina-item" data-name="{{ m.name | lower }}"><a href="opcina-{{ m.slug }}.html">{{ m.name }}</a></div>
{% endfor %}
{% endfor %}
</div>
<script>
function filterOpcine() {
  const q = document.getElementById('q').value.toLowerCase();
  document.querySelectorAll('.opcina-item').forEach(el => {
    el.style.display = el.dataset.name.includes(q) ? '' : 'none';
  });
}
</script>
{% endblock %}
