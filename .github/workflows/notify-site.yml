name: Rebuild muhamed.at

# muhamed.at mounts this guide at /politika/analiza-izbora/, rendering it from
# the main branch of this repo during its own Pages build. Telling that build to
# run is the only cross-repo coupling.
#
# Cross-repository dispatch cannot use GITHUB_TOKEN, so this needs a personal
# access token with `contents: write` on misabegovic/muhamed.github.io, stored
# here as the SITE_DISPATCH_TOKEN secret. Without the secret the job is a no-op
# and the site still picks the change up on its next scheduled daily build.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
    steps:
      - name: Trigger the muhamed.at Pages build
        if: env.SITE_DISPATCH_TOKEN != ''
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/misabegovic/muhamed.github.io/dispatches \
            -d '{"event_type":"izbori-update"}'

      - name: No token configured
        if: env.SITE_DISPATCH_TOKEN == ''
        run: |
          echo "::notice::SITE_DISPATCH_TOKEN is not set; muhamed.at will pick this up on its next daily build."
